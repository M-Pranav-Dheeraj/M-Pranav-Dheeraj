<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}JobPilot AI{% endblock %}</title>
<style>
:root{--bg:#f5f3f8;--surface:#fff;--surface2:#faf7ff;--ink:#17151d;--muted:#716b7c;--line:#e7e1ef;--black:#0c0b10;--purple:#b77af2;--purple2:#8e45cf;--purple3:#6f2bb0;--shadow:0 18px 45px rgba(35,18,55,.10),0 3px 10px rgba(35,18,55,.06)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}
body.dark{--bg:#111016;--surface:#1d1922;--surface2:#241d2b;--ink:#f7f2fb;--muted:#b8aebe;--line:#3b3043;--black:#070609;--shadow:0 20px 55px rgba(0,0,0,.42)}
.app{display:flex;min-height:100vh}.sidebar{width:272px;background:var(--black);color:#fff;position:fixed;inset:0 auto 0 0;padding:26px 18px 18px;display:flex;flex-direction:column;z-index:20;box-shadow:10px 0 35px rgba(20,10,30,.18)}
.logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:850;padding:8px 12px 30px}.logo-mark{width:34px;height:34px;border:1px solid rgba(255,255,255,.55);border-radius:11px;display:grid;place-items:center;color:var(--purple);font-size:18px}
.nav{display:grid;gap:7px}.nav a{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid transparent;border-radius:14px;color:#c9c3d0;font-weight:650;transition:.2s}.nav a .ico{width:22px;text-align:center;font-size:17px}.nav a:hover{background:var(--purple);color:#160c1e;border-color:#d8b5ff;box-shadow:0 8px 22px rgba(183,122,242,.24);transform:translateX(2px)}.nav a.active{background:linear-gradient(135deg,var(--purple),#c99aff);color:#130b19;box-shadow:0 10px 25px rgba(183,122,242,.22)}
.sidebar-bottom{margin-top:auto;border-top:1px solid #28242c;padding-top:16px}.account{display:flex;align-items:center;gap:10px;padding:10px 8px;color:#d4ced9}.avatar{width:38px;height:38px;border-radius:50%;background:var(--purple);color:#160c1e;display:grid;place-items:center;font-weight:800}.email{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.side-actions a,.side-actions button{border:1px solid #39323e;background:#17151b;color:#e8e1eb;border-radius:11px;padding:10px;cursor:pointer;font-weight:700;text-align:center}.side-actions a:hover,.side-actions button:hover{background:var(--purple);color:#150b1d;border-color:var(--purple)}
.main{margin-left:272px;width:calc(100% - 272px);padding:30px 38px 50px;max-width:1700px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800;color:var(--purple3)}.dark .eyebrow{color:#d6aaff}.title{font-size:34px;line-height:1.15;margin:5px 0 5px;letter-spacing:-.035em}.subtitle{color:var(--muted);font-size:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:var(--purple);opacity:.10;right:-35px;top:-35px}.stat-label{color:var(--muted);font-size:13px;font-weight:650}.stat strong{display:block;font-size:31px;margin-top:8px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(310px,.75fr);gap:18px;margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.section-head h2,.section-head h3{margin:0}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;background:var(--purple);color:#170b20;padding:10px 15px;border-radius:12px;font-weight:800;cursor:pointer;transition:.18s}.btn:hover{background:var(--purple3);color:#fff;box-shadow:0 10px 25px rgba(111,43,176,.28);transform:translateY(-1px)}.btn.dark{background:#111015;color:#fff}.btn.dark:hover{background:var(--purple);color:#160c1e}.btn.outline{background:transparent;border-color:var(--line);color:var(--ink)}.btn.outline:hover{background:var(--purple);border-color:var(--purple);color:#150b1d}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:#f1e3ff;color:#6d2ca7;font-size:12px;font-weight:800}.dark .pill{background:#392449;color:#dfbaff}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.tab{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:9px 14px;border-radius:999px;font-weight:750;cursor:pointer;transition:.18s}.tab:hover,.tab.active{background:var(--purple3);border-color:var(--purple3);color:#fff;box-shadow:0 7px 18px rgba(111,43,176,.22)}
.jobs{display:grid;gap:12px}.job{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:17px;transition:.2s;box-shadow:0 7px 18px rgba(30,15,40,.035)}.job:hover{border-color:var(--purple);box-shadow:0 14px 32px rgba(111,43,176,.12);transform:translateY(-2px)}.jobhead{display:flex;justify-content:space-between;gap:14px}.jobtitle{font-size:17px;font-weight:850}.muted{color:var(--muted)}.job p{font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{padding:7px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:750}.suggestions{display:none;margin-top:12px;padding:12px;border-radius:14px;background:var(--surface2);border:1px dashed var(--purple)}input,textarea,select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:6px 0 15px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(183,122,242,.16)}label{font-size:13px;font-weight:800}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.form-grid .full{grid-column:1/-1}.app-row{display:grid;grid-template-columns:1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}.approval{border:1px solid #d7a5ff;background:#fbf2ff}.empty{text-align:center;padding:38px 20px;color:var(--muted)}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.feature{background:var(--surface2);border:1px solid var(--line);border-radius:17px;padding:17px}.feature b{display:block;margin-bottom:6px}.notice{border-left:4px solid var(--purple);background:var(--surface2);padding:14px 16px;border-radius:12px;margin-bottom:15px}.mobile-nav{display:none}
@media(max-width:1050px){.sidebar{width:230px}.main{margin-left:230px;width:calc(100% - 230px);padding:24px}.grid4{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{position:fixed;width:100%;height:68px;inset:auto 0 0;padding:7px 9px;display:block;border-top:1px solid #28242c;box-shadow:0 -10px 30px rgba(0,0,0,.18)}.logo,.sidebar-bottom{display:none}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav a{padding:7px 4px;display:grid;gap:2px;justify-items:center;font-size:10px;border-radius:12px}.nav a .ico{font-size:16px}.main{margin:0;width:100%;padding:20px 14px 90px}.title{font-size:27px}.topbar{align-items:flex-start}.grid4{grid-template-columns:1fr 1fr;gap:10px}.card{padding:16px;border-radius:18px}.form-grid{grid-template-columns:1fr}.mini-grid{grid-template-columns:1fr}.app-row{grid-template-columns:1fr}.jobhead{display:block}.jobhead .pill{margin-top:8px}}

/* Interactive black-sidebar theme */
.sidebar{background:linear-gradient(180deg,#09080c 0%,#0e0c12 55%,#070609 100%);border-right:1px solid rgba(183,122,242,.14);box-shadow:10px 0 35px rgba(20,10,30,.18);transition:box-shadow .25s ease,transform .25s ease}
.sidebar:hover{box-shadow:12px 0 45px rgba(183,122,242,.11),10px 0 35px rgba(20,10,30,.22)}
.nav{gap:8px}
.nav a{position:relative;transition:background .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s}
.nav a:before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:0 4px 4px 0;background:transparent;transition:.2s}
.nav a .ico{height:24px;width:24px;display:grid;place-items:center;border-radius:8px;transition:.2s}
.nav a:hover{background:linear-gradient(90deg,rgba(183,122,242,.22),rgba(183,122,242,.05));color:#fff;border-color:rgba(183,122,242,.35);box-shadow:inset 0 0 0 1px rgba(183,122,242,.06),0 8px 22px rgba(0,0,0,.18);transform:translateX(3px)}
.nav a:hover:before{background:var(--purple)}
.nav a:hover .ico{background:var(--purple);color:#160c1e;box-shadow:0 0 0 4px rgba(183,122,242,.10)}
.nav a.active{background:linear-gradient(100deg,var(--purple),#c99aff);color:#130b19;border-color:#d9b5ff;box-shadow:0 10px 28px rgba(183,122,242,.24),inset 0 1px rgba(255,255,255,.38);transform:translateX(3px)}
.nav a.active:before{background:#fff}
.nav a.active .ico{background:rgba(255,255,255,.34);color:#160c1e}
.sidebar-bottom{border-top-color:rgba(255,255,255,.10)}
.sidebar-bottom:before{content:"";display:block;width:45px;height:2px;background:var(--purple);border-radius:2px;margin:0 8px 12px;opacity:.8}
.side-actions a,.side-actions button{transition:.18s}
.side-actions a:hover,.side-actions button:hover{box-shadow:0 8px 20px rgba(183,122,242,.22);transform:translateY(-1px)}
.main{transition:transform .25s ease}
.sidebar:hover~.main{transform:translateX(1px)}
</style>
</head>
<body class="{{'dark' if settings and settings.theme=='dark' else ''}}">
<div class="app">
<aside class="sidebar">
  <a class="logo" href="/dashboard"><span class="logo-mark">◈</span>JobPilot AI</a>
  <nav class="nav">
    <a href="/dashboard" class="{{'active' if active=='dashboard' else ''}}"><span class="ico">⌂</span>Dashboard</a>
    <a href="/jobs" class="{{'active' if active=='jobs' else ''}}"><span class="ico">⌕</span>Find Jobs</a>
    <a href="/applications" class="{{'active' if active=='applications' else ''}}"><span class="ico">▤</span>Applications</a>
    <a href="/profile" class="{{'active' if active=='profile' else ''}}"><span class="ico">◯</span>Profile</a>
  </nav>
  <div class="sidebar-bottom">
    <div class="account"><div class="avatar">{{(profile.name or user.email)[:1]|upper}}</div><div class="email">{{user.email}}</div></div>
    <div class="side-actions">
      <a href="/settings" title="Settings">⚙ Settings</a>
      <form action="/logout" method="post"><button type="submit" style="width:100%">↪ Logout</button></form>
    </div>
  </div>
</aside>
<main class="main">
<header class="topbar">
  <div>{% block header %}{% endblock %}</div>
  <div>{% block top_action %}{% endblock %}</div>
</header>
{% block content %}{% endblock %}
</main>
</div>
<script>
function filterJobs(mode,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.jobitem').forEach(j=>{let s=+j.dataset.score,a=+j.dataset.applied;j.style.display=(mode==='all'||(mode==='high'&&s>=80)||(mode==='new'&&!a))?'block':'none'})}
async function suggest(id){let box=document.getElementById('s'+id);if(!box)return;box.style.display='block';box.innerHTML='Loading suggestions…';try{let r=await fetch('/api/job/'+id+'/suggestions');let d=await r.json();box.innerHTML='<strong>Suggested changes</strong><ul>'+d.suggestions.map(x=>'<li>'+x+'</li>').join('')+'</ul>'}catch(e){box.textContent='Could not load suggestions.'}}

document.querySelectorAll('.nav a').forEach(link=>{
  link.addEventListener('mouseenter',()=>document.body.classList.add('sidebar-focus'));
  link.addEventListener('mouseleave',()=>document.body.classList.remove('sidebar-focus'));
  link.addEventListener('focus',()=>document.body.classList.add('sidebar-focus'));
  link.addEventListener('blur',()=>document.body.classList.remove('sidebar-focus'));
});
</script>
</body></html>
